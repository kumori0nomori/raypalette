name: Ubuntu CPU

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [debug, release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            clang-format \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Configure CPU GUI build
        run: cmake --preset linux-cpu-${{ matrix.configuration }}

      - name: Check formatting
        run: cmake --build --preset linux-cpu-${{ matrix.configuration }} --target format-check

      - name: Build
        run: cmake --build --preset linux-cpu-${{ matrix.configuration }} --parallel

      - name: Run tests
        run: ctest --preset linux-cpu-${{ matrix.configuration }} --output-on-failure
