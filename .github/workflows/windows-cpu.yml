name: Windows CPU

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up MSVC development environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CPU GUI build
        run: >-
          cmake -S . -B build/windows-ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DRAYPALETTE_ENABLE_CUDA=OFF
          -DRAYPALETTE_BUILD_GUI=ON
          -DRAYPALETTE_FETCH_DEPENDENCIES=ON

      - name: Build
        run: cmake --build build/windows-ci --parallel

      - name: Run tests
        run: ctest --test-dir build/windows-ci --output-on-failure
